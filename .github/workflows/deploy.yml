# Builds the catalogue and publishes it to GitHub Pages at https://compud.it
#
# Only the prerendered output in dist/client is published: the order-tracking
# routes (/checkout/<ref> and /api/*) are server-rendered and have no runtime on
# Pages. Nothing in the static site links to them — checkout composes a mailto:
# instead — so the published site is complete.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://compud.it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Fails the build rather than publishing "[P.IVA]" / "[TELEFONO]" to the
      # live site if a company detail is ever left unset.
      - name: Check no placeholders reached the output
        run: |
          if grep -rq '\[P\.IVA\]\|\[REA\]\|\[TELEFONO\]\|\[INDIRIZZO\]\|\[CITTÀ\]\|\[CAP\]' dist/client; then
            echo "::error::placeholder company details found in the build output"
            grep -rol '\[P\.IVA\]\|\[REA\]\|\[TELEFONO\]\|\[INDIRIZZO\]\|\[CITTÀ\]\|\[CAP\]' dist/client
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
